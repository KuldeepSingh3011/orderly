server:
  port: 8084

spring:
  application:
    name: recommendation-service

  # MongoDB and Redis Configuration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/orderly}
      database: ${SPRING_DATA_MONGODB_DATABASE:orderly}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# AI Configuration (Ollama)
ai:
  ollama:
    base-url: http://localhost:11434
    model: llama2
    timeout: 30000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Logging
logging:
  level:
    com.orderly: DEBUG
