server:
  port: 8081

spring:
  application:
    name: order-service

  # MongoDB and Redis Configuration
  # Supports Railway's MONGO_URL/DATABASE_URL and standard SPRING_DATA_MONGODB_URI
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGO_URL:${DATABASE_URL:mongodb://localhost:27017/orderly}}}
      database: ${SPRING_DATA_MONGODB_DATABASE:orderly}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.orderly.common.events

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.orderly: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.mongodb: INFO
