server:
  port: 8083

spring:
  application:
    name: notification-service

  # MongoDB for notification history
  # Supports Railway's MONGO_URL/DATABASE_URL and standard SPRING_DATA_MONGODB_URI
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGO_URL:${DATABASE_URL:mongodb://localhost:27017/orderly}}}
      database: ${SPRING_DATA_MONGODB_DATABASE:orderly}

  # Kafka
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.orderly.common.events

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Logging
logging:
  level:
    com.orderly: DEBUG
    org.springframework.kafka: INFO
